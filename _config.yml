# Site settings
locale: "en-US"
title: "Junteng Liu"
title_separator: "-"
name: "Junteng Liu"
description: "Personal academic homepage of Junteng Liu, First-year PhD candidate at HKUST NLP Group researching natural language processing and machine learning."
url: "https://warblerroute.github.io"
baseurl: "/LJT-Homepage"
repository: "WarblerRoute/LJT-Homepage"

# Site author
author:
  name: "Junteng Liu"
  bio: "First-year PhD candidate at HKUST NLP Group researching natural language processing and machine learning."
  employer: "HKUST NLP Group"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

# Publication categories
publication_category:
  manuscripts:
    title: "Arxiv Papers"
  conferences:
    title: "Conference Papers"

# Template collections are not used as separate generated pages.
collections:
  teaching:
    output: false
    permalink: /:collection/:path/
  publications:
    output: false
    permalink: /:collection/:path/
  portfolio:
    output: false
    permalink: /:collection/:path/
  talks:
    output: false
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "teaching"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "talks"
    values:
      layout: "talk"
      author_profile: true

# Jekyll processing
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

include:
  - .htaccess
  - _pages

exclude:
  - .bundle
  - .github
  - .sass-cache
  - .jekyll-assets-cache
  - AGENTS.md
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - package.json
  - package-lock.json
  - vendor
  - README.md
  - files
  - markdown_generator
  - scripts
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - images/500x300.png
  - images/bio-photo.jpg
  - images/bio-photo-2.jpg
  - images/editing-talk.png
  - images/og-image.png
  - images/themes
  - images/wiki

keep_files:
  - .git
  - .svn


sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
